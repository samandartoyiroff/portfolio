server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/portfolio
    username: postgres
    password: 123456
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 15MB
      enabled: true
      max-request-size: 15MB

json:
  web:
    token:
      cookie-name: portfolio-jwt
      refresh-cookie-name: portfolio-refresh
      secret: 1234567891011131123456789101113112345678910111311234567891011131
      validation-time: 28800000
      refresh-time: 57600000

file:
  upload:
    directory:
      image: uploads/images/
      file: uploads/files/
      static: uploads/static/
    size: 63000000